name: Publish WASM build to itch.io

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "itch.io channel suffix (e.g. html5, html5-preview)"
        default: "html5"
        required: true
  push:
    tags:
      - 'v*'

env:
  ITCH_TARGET: ericjwi/jaspers-world-bevy
  CRATE_NAME: jaspersworld

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown -p ${{ env.CRATE_NAME }}

      - name: Install wasm-bindgen-cli (matching Cargo.lock)
        run: |
          WBG_VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -n1 | cut -d'"' -f2)
          echo "Installing wasm-bindgen-cli ${WBG_VERSION}"
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBG_VERSION}/wasm-bindgen-${WBG_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "wasm-bindgen-${WBG_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"

      - name: Generate JS bindings
        run: |
          mkdir -p dist
          wasm-bindgen --no-typescript --target web \
            --out-dir dist/ \
            --out-name ${{ env.CRATE_NAME }} \
            target/wasm32-unknown-unknown/release/${{ env.CRATE_NAME }}.wasm

      - name: Stage assets and levels
        run: |
          cp -r assets dist/
          cp -r levels dist/

      - name: Write index.html
        run: |
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Jasper's World</title>
              <style>
                html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
                canvas { display: block; margin: 0 auto; outline: none; }
              </style>
            </head>
            <body>
              <script type="module">
                import init from './jaspersworld.js';
                init();
              </script>
            </body>
          </html>
          HTML

      - name: Install butler
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/.butler"
          chmod +x "$HOME/.butler/butler"
          echo "$HOME/.butler" >> "$GITHUB_PATH"

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'html5' }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "Pushing $VERSION to ${ITCH_TARGET}:${CHANNEL}"
          butler push dist/ "${ITCH_TARGET}:${CHANNEL}" --userversion "$VERSION"
